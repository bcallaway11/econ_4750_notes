project:
  type: book

book:
  title: "Detailed Course Notes for ECON 4750"
  author: "Brantly Callaway"
  sidebar:
    style: floating
  chapters:
    - part: "Start"
    - index.qmd
    - 02-data.qmd
    - part: "Statistical Programming"
    - 03-introduction_to_R.qmd
    - 04-programming_in_R.qmd
    - part: "Probability"
    - 05-random_variables.qmd
    - 06-expectations.qmd
    - part: "Properties of Estimators"
    - 07-finite_sample_properties.qmd
    - 08-asymptotic_properties.qmd
    - 09-inference.qmd
    - part: "Regression"
    - 10-interpreting_regressions.qmd
    - 11-regression_computation.qmd
    - 12-regression_inference.qmd
    - part: "Advanced Topics"
    - 13-binary_outcomes.qmd
    - part: "Prediction"
    - 14-model_selection.qmd
    - 15-machine_learning.qmd
    - part: "Causal Inference"
    - 16-causal_inference_concepts.qmd
    - 17-experiments.qmd
    - 18-natural_experiments.qmd
    - 19-observational_data.qmd

bibliography: refs.bib

execute:
  # Code that runs before each document
  code: |
    source("setup_hooks.R")

format:
  html:
    theme: [united, 4750_theme.scss]
    css: 4750_style.css
    includes:
      in-header: preamble.tex
    filters:
      - include_if_html.lua
  pdf:
    documentclass: scrreprt
    pdf-engine: pdflatex
    includes:
      in-header: preamble.tex



